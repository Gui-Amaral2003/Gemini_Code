[airflow.dags.ingestao_diaria]
description = "Pipeline fictício de atualização diária"

[database.tables.sample_deals]
connection = "sqlserver_main"
schema = "sales"
return_columns = ["id", "status", "value"]

[database.tables.sample_deals.filter_columns]
id = "int"
status = "str"
value = "float"

