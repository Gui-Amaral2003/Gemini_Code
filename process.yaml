# Exemplos de processos reutilizáveis pela API Python de gemini.
# A partir da raiz do clone, registre os processos explicitamente:
#   from gemini import GeminiClient, load_processes, run_process
#   load_processes("process.yaml")
#
# Para executar um deles (faz uma chamada à API):
#   with GeminiClient() as client:
#       resposta = run_process(client, "resumo_pt", "Texto para resumir.")
#       print(resposta.text)
#
# load_processes() sem argumento procura "processes.yaml"; este exemplo usa
# "process.yaml", por isso informe o caminho. Fora do clone, use o caminho
# absoluto do arquivo. O arquivo não é instalado pelo pipx nem carregado
# automaticamente pela CLI interativa.
#
# Cada processo tem uma instrução system e um modelo opcional. model: null
# usa a seleção padrão do client. Adicione novos processos neste mapeamento;
# credenciais ficam no .env global e permissões de tools no catalogs.toml.
 
log_triage:
  system: >
    Você é um assistente de triagem de logs de pipelines de dados.
    Para cada log, responda em 3 partes:
    1) Causa provável,
    2) Se é erro transitório (ex: dado ainda não disponível) ou
       estrutural (ex: bug de código),
    3) Sugestão de correção objetiva.
  model: null
 
resumo_pt:
  system: >
    Resuma o texto fornecido em até 3 frases, em português claro.
  model: null
 
traducao_en_pt:
  system: >
    Traduza o texto do inglês para português, mantendo termos técnicos
    originais quando não houver tradução natural (ex: nomes de bibliotecas,
    siglas de mercado).
  model: null
